# Production: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Farqi dev'dan: tashqariga faqat Caddy (80/443) ochiq; backend, frontend, db, redis host portiga chiqmaydi;
# kod volume'i va reload yo'q; hamma xizmatda healthcheck, restart: always va resurs limitlari; APP_ENV=production.
# Batafsil: docs/DEPLOY.md

x-backend-env: &backend-env
  env_file:
    - ${ENV_FILE:-.env}
  environment: &backend-environment
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    SEED_DEMO: "false"
    CORS_ORIGINS: https://${DOMAIN}
    PUBLIC_BASE_URL: https://${DOMAIN}
    MOCK_SMS_OUTBOX: ""

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=1000"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1g}
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m}

  backend:
    build:
      context: ./backend
      target: runtime
    image: clinic-backend:${VERSION:-latest}
    restart: always
    <<: *backend-env
    environment:
      <<: *backend-environment
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1g}
    stop_grace_period: 30s
    # ports yo'q: faqat compose tarmog'ida (frontend/nginx orqali)

  worker:
    image: clinic-backend:${VERSION:-latest}
    restart: always
    <<: *backend-env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME -t 5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768m}

  beat:
    image: clinic-backend:${VERSION:-latest}
    restart: always
    <<: *backend-env
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD-SHELL", "grep -qa beat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

  frontend:
    build: ./frontend
    image: clinic-frontend:${VERSION:-latest}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m}

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m}

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
