name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.22
      - run: ruff check backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    name: Backend testlari (pytest + PostgreSQL)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@localhost:5432/clinic
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: pytest
        working-directory: backend

  build:
    name: Frontend build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  e2e:
    name: "E2E smoke (Playwright, alohida test bazasi)"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: "Test muhiti (.env): alohida clinic_e2e bazasi, demo ma'lumot, mock SMS va fiskal"
        run: |
          cat > .env <<'ENV'
          POSTGRES_USER=clinic
          POSTGRES_PASSWORD=ci-e2e-password
          POSTGRES_DB=clinic_e2e
          SEED_DEMO=true
          JWT_SECRET=ci-e2e-secret-ci-e2e-secret-ci-e2e-secret
          LINK_SECRET=ci-e2e-link-secret-ci-e2e-link-secret
          CORS_ORIGINS=http://localhost:5180
          PUBLIC_BASE_URL=http://localhost:5180
          APP_ENV=test
          SMS_BACKEND=mock
          MOCK_SMS_OUTBOX=/tmp/sms-outbox.jsonl
          FISCAL_BACKEND=mock
          AI_ENABLED=false
          ENV
      - name: Stekni ishga tushirish (db, redis, backend, frontend)
        run: docker compose up -d --build --wait db redis backend frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright testlari
        run: npx playwright test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5180
      - name: "Xato bo'lsa: konteyner jurnallari"
        if: failure()
        run: docker compose logs --no-color --tail 200 backend frontend > e2e/container-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/container-logs.txt
          retention-days: 7
