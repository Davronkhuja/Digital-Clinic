server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* -> backend (vite dev proxy bilan bir xil: /api prefiksi olib tashlanadi)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html keshlanmaydi: yangi deploy darhol ko'rinsin (assets/ nomlari xesh bilan)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Statik fayllar uzoq keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
