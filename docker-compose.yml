services:
  db:
    image: postgres:16-alpine
    container_name: digital-clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Host portiga ochilmagan: faqat compose tarmog'ida (backend) ko'rinadi

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: digital-clinic-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Demo ma'lumotlar standart o'chiq; lokal ishlash uchun .env da SEED_DEMO=true
      SEED_DEMO: ${SEED_DEMO:-false}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/data/uploads   # EMR fayl ilovalari (keyinchalik S3/MinIO: STORAGE_BACKEND)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"   # Swagger: http://localhost:8010/docs

  # Xabarlar (4-bosqich): Redis + Celery worker va beat. Yengil: redis alpine (64 MB), worker/beat backend imajidan (qo'shimcha imaj yo'q).
  redis:
    image: redis:7-alpine
    container_name: digital-clinic-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Host portiga ochilmagan

  worker:
    build:
      context: ./backend
      target: runtime
    image: digital-clinic-backend
    container_name: digital-clinic-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:   # imajdagi HTTP tekshiruv (backend :8000) bu yerga mos emas
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME -t 5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      target: runtime
    image: digital-clinic-backend
    container_name: digital-clinic-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:   # beat'da HTTP yo'q: jarayon borligi tekshiriladi
      test: ["CMD-SHELL", "grep -qa beat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # Telegram bot (lokalda long polling): faqat `docker compose --profile bot up -d bot`; token .env da (TELEGRAM_BOT_TOKEN)
  bot:
    profiles: ["bot"]
    build:
      context: ./backend
      target: runtime
    image: digital-clinic-backend
    container_name: digital-clinic-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.bot"]
    depends_on:
      backend:
        condition: service_healthy

  # Testlar: docker compose --profile test run --rm test   (alohida `<POSTGRES_DB>_test` bazasi)
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: digital-clinic-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5180:80"     # Ilova: http://localhost:5180

volumes:
  pgdata:
  uploads:
