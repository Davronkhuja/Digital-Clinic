services:
  db:
    image: postgres:16-alpine
    container_name: digital-clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Host portiga ochilmagan: faqat compose tarmog'ida (backend) ko'rinadi

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: digital-clinic-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Demo ma'lumotlar standart o'chiq; lokal ishlash uchun .env da SEED_DEMO=true
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - uploads:/data/uploads   # EMR fayl ilovalari (keyinchalik S3/MinIO: STORAGE_BACKEND)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"   # Swagger: http://localhost:8010/docs

  # Testlar: docker compose --profile test run --rm test   (alohida `<POSTGRES_DB>_test` bazasi)
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: digital-clinic-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5180:80"     # Ilova: http://localhost:5180

volumes:
  pgdata:
  uploads:
